<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>条目 · 韵部探索器</title>

  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/layout.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/entry.css" />
  <link rel="stylesheet" href="assets/css/transition.css" />

  <script defer src="assets/js/charmaps.js"></script>
  <script defer src="assets/js/dictionary-data.js"></script>
  <script defer src="assets/js/dictionary.js"></script>
  <script defer src="assets/js/transition.js"></script>
  <script defer src="assets/js/entry.js"></script>
</head>

<body>
  <div class="topbar">
    DICTIONARY / 条目视图
    <span>三江 · 四支 · 据所提供文本整理，待核验</span>
  </div>

  <div class="shell">
    <header>
      <div class="brand">
        <div class="seal">韵</div>

        <div>
          <div class="brand-title">条目查询</div>
          <div class="brand-sub">三江 · 四支 · 字词与引文查询</div>
        </div>
      </div>

      <nav>
        <a href="index.html">← 返回大厅</a>
        <a href="sources.html">词语与引文</a>
        <a href="index.html#method">口径说明</a>
      </nav>
    </header>

    <main>
      <section class="panel query-bar" aria-label="条目查询">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <circle cx="11" cy="11" r="7"></circle>
          <path d="m20 20-4-4"></path>
        </svg>

        <input
          id="entryQuery"
          type="search"
          maxlength="80"
          placeholder="输入字、词语或韵部名（江、春江、四支…）"
          aria-label="输入字、词语或韵部名"
        />

        <button class="text-link" id="entryGo" type="button">查询 →</button>
        <span class="query-hint muted" id="queryHint"></span>
      </section>

      <nav class="result-views" id="resultViews" aria-label="查询结果视图"></nav>
      <div id="entryRoot" aria-live="polite"></div>
    </main>

    <footer>
      <div>
        <div class="footer-mark">条目查询 / entry</div>
        <div>词典式条目视图 · 无后端 · 源文件字形与释义</div>
      </div>

      <div class="footer-meta">
        数据按提供文本整理，尚未经逐字校对<br />
        收录范围：四支、三江
      </div>
    </footer>
  </div>
</body>
</html>
